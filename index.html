<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)">
  <title>Compound</title>

  <!-- Tells Android this website can be installed as an app -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <!-- Fonts: Instrument Serif (headings & big numbers) + Inter (everything else) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="core/base.css">
  <!-- Tracker styles: one line each -->
  <link rel="stylesheet" href="trackers/money.css">
  <link rel="stylesheet" href="trackers/loan.css">
  <link rel="stylesheet" href="trackers/health.css">
  <link rel="stylesheet" href="trackers/flow.css">
  <link rel="stylesheet" href="trackers/care.css">
</head>
<body>
  <!-- Confetti is drawn on this invisible layer -->
  <canvas id="fx"></canvas>

  <!-- The whole app is drawn inside here by app.js -->
  <div id="app"></div>

  <div id="toasts"></div>
  <div id="modal-root"></div>

  <!-- Core engine (load first) -->
  <script src="core/helpers.js"></script>
  <script src="core/state.js"></script>
  <script src="core/game.js"></script>
  <script src="core/ui.js"></script>
  <script src="core/home.js"></script>
  <script src="core/motion.js"></script>

  <!-- Trackers: one line each. To add a tracker, add its line here (and its stylesheet above). -->
  <script src="trackers/money.js"></script>
  <script src="trackers/loan.js"></script>
  <script src="trackers/health.js"></script>
  <script src="trackers/flow.js"></script>
  <script src="trackers/care.js"></script>

  <!-- Start-up (load last) -->
  <script src="core/main.js"></script>
</body>
</html>
