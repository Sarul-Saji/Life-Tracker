<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)">
  <title>Compound</title>

  <!-- Tells Android this website can be installed as an app -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <!-- Fonts: Instrument Serif (headings & big numbers) + Inter (everything else) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Confetti is drawn on this invisible layer -->
  <canvas id="fx"></canvas>

  <!-- The whole app is drawn inside here by app.js -->
  <div id="app"></div>

  <div id="toasts"></div>
  <div id="modal-root"></div>

  <script src="app.js"></script>
</body>
</html>
